name: Dandy's World Twisted Tracker

on:
  schedule:
    # GitHub cron uses UTC. 01:00 UTC is 8:00 PM fixed EST.
    - cron: "0 1 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          TARGET_TWISTED: ${{ vars.TARGET_TWISTED }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          SEND_TEST: "0"
        run: |
          RUN_ONCE=1 python twisted_tracker.py

      - name: Persist notification state
        run: |
          if git diff --quiet -- last_notified.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_notified.txt
          git commit -m "chore: update twisted tracker state"
          git push
